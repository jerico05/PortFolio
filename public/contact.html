<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>JericoFolio-Contact</title>
</head>
<body>
    <header class="site-header">
        <div class="headerContainer">
            <div class="logoContainer"><h1>JERICOFOLIO</h1></div>
            <nav class="navbar">
                <ul>
                    <li><a href="accueil.html">Accueil</a></li>
                    <li><a href="projet.html">Projets</a></li>
                    <li><a href="about.html">A propos de moi</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
    <section>
         <div class="titreContainer">
            <h1>Contact</h1>
         </div>
        <div class="formContainer">
            <form id="contactForm">
                <label for="name">Nom et Prénoms</label>
                <input type="text" name="name" id="name" required>
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>
                <label for="title">Sujet</label>
                <input type="title" name="title" id="title" required>
                <label for="message">Message</label>
                <textarea name="message" id="message" required></textarea>
                <button type="submit" class="submitBtn">Envoyer</button>
            </form>
        </div>
    </section>
    </main>
    <footer>
        <p>© 2026 JericoFolio — Tous droits réservés.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
